<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<link rel="stylesheet" type="text/css" href="webjars/bootstrap/4.3.1/css/bootstrap.min.css" />

<head>
	<meta charset="utf-8">
	<title>Ajout des Patients</title>
</head>

<body>
	<div th:replace="template"></div>
	<div class="container mt-5">
		<div class="card">
			 <div class="card-header" th:if="${mode=='new'}"> Ajout des Patients </div>
			<div class="card-header" th:if="${mode=='edit'}">Modification des Patients </div>
			<div class="card-body">
				<form th:action="@{savePatient}" th:object="${patient}" method="post">
					<input hidden name="page" class="form-control" th:value="${page}" />
					<input hidden name="size" class="form-control" th:value="${size}" />

					<div class="form-group">
					<label class="control-label" hidden>ID Patient :</label>
					<input type="hidden" name="idPatient" class="form-control"
					th:value="${patient.idPatient}" />
					 </div>
					<div class="form-group">
						
						<label class="control-label">Nom Patient :</label>
						<input type="text" th:field="*{nomPatient}" class="form-control"/>
						      <span th:errors="*{nomPatient}" class="text-danger"></span>

					</div>
					<div class="form-group">
						<label class="control-label">Prix Consultation :</label>
						<input type="text" th:field="*{tarifConsultation}" class="form-control"/>
						      <span th:errors="*{tarifConsultation}" class="text-danger"></span>

					</div>
					<div class="form-group">
						<label class="control-label">date Consultation :</label>
						<input type="date" th:field="*{dateConsultation}" class="form-control"/>
						       <span th:errors="*{dateConsultation}" class="text-danger"></span>

					</div>
					
					
					
					<div class="form-group">
					<label class="control-label">Genre :</label>
					<select name="genre" class="form-control"
					th:value="${patient.genre.idGenre}"
					th:if="${!#strings.isEmpty(patient.genre)}" >
					<option th:each="c:${genres}" th:if="${mode=='edit'}"
					 th:value="${c.idGenre}" th:text="${c.nomGenre}"
					 th:selected="${ c.idGenre==patient.genre.idGenre}">
					</option>
					</select>
					<select name="genre" class="form-control"
					th:if="${#strings.isEmpty(patient.genre)}">
					<option th:each="c:${genres}" th:value="${c.idGenre}"
					th:text="${c.nomGenre}">
					</option>
					</select>
					</div>
					
					
					
					
					
					
					
					
					<div>
						<button type="submit" class="btn btn-primary">Valider</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
